<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hide The Annoying</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="top">
      <div class="identity">
        <img src="../icons/icon-48.png" alt="" class="mark" width="22" height="22">
        <div>
          <h1>Hide The Annoying</h1>
          <p class="count"><span id="stat-filtered">0</span> filtered out of <span id="stat-checked">0</span></p>
        </div>
      </div>
      <label class="switch" title="Turn filtering on or off">
        <input type="checkbox" id="master-toggle">
        <span class="slider"></span>
      </label>
    </header>

    <div class="mode">
      <p class="mode-label">Show as</p>
      <div class="segment" role="radiogroup" aria-label="How filtered posts appear">
      <label>
        <input type="radio" name="filterMode" value="collapse" checked>
        <span>Collapse</span>
      </label>
      <label>
        <input type="radio" name="filterMode" value="hide">
        <span>Hide</span>
      </label>
      <label>
        <input type="radio" name="filterMode" value="badge">
        <span>Badge</span>
      </label>
      </div>
    </div>

    <div class="topics">
      <label class="chip">
        <input type="checkbox" id="cat-politics">
        <span>Politics</span>
      </label>
      <label class="chip">
        <input type="checkbox" id="cat-soccer">
        <span>Soccer</span>
      </label>
      <label class="chip">
        <input type="checkbox" id="cat-finance">
        <span>Crypto</span>
      </label>
      <label class="chip">
        <input type="checkbox" id="cat-custom">
        <span>Custom</span>
      </label>
    </div>

    <section class="account" aria-label="Account">
      <div id="free-tier-signed-out">
        <button type="button" id="btn-google-sign-in" class="btn-google">Continue with Google</button>
        <p class="hint" id="free-tier-hint">Daily quota. Posts are read up to 1,000 characters.</p>
        <p class="error" id="free-tier-error"></p>
      </div>
      <div id="free-tier-signed-in" hidden>
        <div class="account-row">
          <span id="free-tier-email" class="email"></span>
          <button type="button" id="btn-sign-out" class="text-btn">Sign out</button>
        </div>
        <p class="hint" id="free-tier-quota"></p>
      </div>
    </section>

    <details class="fold" id="own-key">
      <summary>Own key</summary>
      <div class="fold-body">
        <div class="key-field">
          <input type="password" id="api-key-input" placeholder="TypeSafe key" class="text-input" autocomplete="off">
          <button type="button" id="toggle-key-visibility" class="ghost" title="Show key">Show</button>
        </div>
        <p class="hint">Skips the daily limit and the character cut.</p>
      </div>
    </details>

    <footer class="foot">
      <button type="button" id="btn-open-options" class="text-btn">Options</button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
